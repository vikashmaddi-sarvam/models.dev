# Pricing: metered as sarvam-105b, so the same prices apply. List price INR 15.00 input / 5.00 cached input / 60.00 output
# per 1M tokens, https://docs.sarvam.ai/changelog/2026/10/10.md (accessed 2026-11-25). Introductory INR 10.00 / 0.25 / 25.00
# applies through the end of 2026 (https://docs.sarvam.ai/api/getting-started/pricing.md, accessed 2026-11-25); the date overrides carry it.
# INR->USD at 94 INR per USD, the rate Sarvam publishes for its USD view on https://www.sarvam.ai/token-factory/pricing (accessed 2026-11-17), rounded to 8 decimals.
# The voice-turn checkpoint of sarvam-105b: thinking off, and any reasoning_effort is ignored.
# https://docs.sarvam.ai/api-reference-docs/chat/chat-completions (accessed 2026-11-17)
# Context: GET https://api.sarvam.ai/v2/models publishes context_length 32000 for this host.
# max_completion_tokens: the host accepts it up to the 32,000 window, so no max_tokens override is needed.
schema = 2
base_model = "sarvam/sarvam-105b"
name = "Sarvam-105B Conversations"

[capabilities]
reasoning = { supported = false }
cache = { implicit = true }

[limit]
context = 32_000
output = 32_000

[cost.text.input]
price = 0.15957447
cache = { read = 0.05319149 }

[[cost.text.input.overrides]]
when = { date = { lt = "2027-01-01" } }
price = 0.10638298
cache = { read = 0.00265957 }

[cost.text.output]
price = 0.63829787

[[cost.text.output.overrides]]
when = { date = { lt = "2027-01-01" } }
price = 0.26595745
