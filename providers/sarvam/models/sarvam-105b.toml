# Pricing: https://www.sarvam.ai/api-pricing (LLM, accessed 2026-11-18): Sarvam 105B INR 15.00 input / 5.00 cached input / 60.00 output per 1M tokens.
# INR->USD at 94 INR per USD (the pricing page's USD toggle, 2026-11-11), rounded to 8 decimals.
# Toggle: reasoning_effort = null (off)
# Effort: reasoning_effort = low|medium|high
schema = 2
base_model = "sarvam/sarvam-105b"
name = "Sarvam-105B"

[capabilities]
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high"] }

[limit]
context = 128_000
output = 128_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.15957447
cache = { read = 0.05319149 }

[cost.text.output]
price = 0.63829787
